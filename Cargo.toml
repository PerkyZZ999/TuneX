[workspace]
members = ["crates/*"]
# Explicit: virtual manifests do not inherit the edition-implied resolver.
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
# App-internal crates: never published to crates.io (V1 ships via AUR).
# Also silences `cargo_common_metadata`, which only applies to publishables.
publish = false

[workspace.dependencies]
# Latest compatible at introduction (`cargo add`); `cargo update` before releases.
thiserror = "2.0.20"
# Used only by `#[cxx_qt::bridge]` macro expansion (`include!`, `UniquePtr`
# paths); invisible to shear, so see the ignore below. Verified required by
# removing it (build breaks).
cxx = "1.0.198"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_full"] }
cxx-qt-build = { version = "0.10.0", features = ["link_qt_object_files"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
gstreamer = "0.24.5"
tokio = { version = "1.53.1", features = ["sync", "rt", "rt-multi-thread", "macros", "time"] }
rusqlite = "0.40.2"
rusqlite_migration = "2.5.0"
lofty = "0.24.0"
mpris-server = { version = "0.10.0", features = ["tokio"] }

# Intra-workspace path deps land here alongside their first real `use`,
# so `cargo-shear` never sees an unused workspace dep.
tunex-core = { path = "crates/tunex-core", version = "0.1.0" }
tunex-library = { path = "crates/tunex-library", version = "0.1.0" }
tunex-player = { path = "crates/tunex-player", version = "0.1.0" }

# Static verification baseline (M-STATIC-VERIFICATION).
# The toolchain runs Clippy with `-D warnings`, so every `warn` below
# is a hard gate in CI and pre-commit.
[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
# Allowed with reason: cxx-qt 0.10 itself mixes syn 2 (cxx-qt-gen macros) and
# syn 3 (cxx-gen 0.7 build graph). No action available downstream; revisit on
# cxx-qt upgrades. (M-LINT-OVERRIDE-EXPECT: narrow, documented.)
multiple_crate_versions = "allow"
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
# Restriction subset: consistency without exoticism.
allow_attributes_without_reason = "warn"
deref_by_slicing = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unneeded_field_pattern = "warn"
