sonar.projectKey=tunex
sonar.projectName=TuneX

sonar.sources=.
sonar.sourceEncoding=UTF-8

sonar.exclusions=target/**,build/**,fuzz/corpus/**,fuzz/artifacts/**

# Rust-Toolchain owns Clippy execution.
sonar.rust.clippy.enabled=false

# Import the single Clippy execution generated by Rust-Toolchain.
sonar.rust.clippyReport.reportPaths=target/rust-toolchain/clippy.json

# Import coverage generated by cargo-llvm-cov.
sonar.rust.lcov.reportPaths=target/rust-toolchain/lcov.info
