# Rust-Toolchain dependency policy.
# Review licenses, bans, and sources for the target project.
# See https://embarkstudios.github.io/cargo-deny/ for full options.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # RUSTSEC-2024-0436: `paste` is unmaintained (no CVE, informational).
    # Transitive via lofty 0.24.0 (macro use only, build-time); no safe
    # upgrade exists until upstream migrates. Re-evaluate on lofty upgrades.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # TuneX itself is GPLv3 (D-013); our own crates carry it.
    "GPL-3.0-or-later",
    # mpris-server (MPRIS D-Bus layer) is file-level copyleft, combinable
    # into the GPLv3 app binary.
    "MPL-2.0",
    # notify (filesystem watcher) is a public-domain dedication (CC0-1.0,
    # FSF-free): no restrictions to conflict with the GPLv3 app binary.
    "CC0-1.0",
]
unused-allowed-license = "allow"
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
