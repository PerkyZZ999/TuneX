[package]
name = "tunex-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "TuneX application wiring: cxx-qt bridge, QML models, watcher, settings, MPRIS."

[[bin]]
name = "tunex"
path = "src/main.rs"

[dependencies]
cxx.workspace = true
cxx-qt.workspace = true
cxx-qt-lib.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tunex-core.workspace = true

[build-dependencies]
cxx-qt-build.workspace = true

# `cxx` is referenced only from `#[cxx_qt::bridge]` macro expansion, which
# shear cannot see. Verified load-bearing by removal (build breaks).
[package.metadata.cargo-shear]
ignored = ["cxx"]

[lints]
workspace = true
