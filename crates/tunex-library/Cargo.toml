[package]
name = "tunex-library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "TuneX library engine: scan, metadata, SQLite/FTS5, artwork, playlists, search."

[dependencies]
blake3.workspace = true
image.workspace = true
lofty.workspace = true
notify.workspace = true
rusqlite.workspace = true
rusqlite_migration.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tunex-core.workspace = true
ureq = { workspace = true, optional = true }

[features]
# Live MusicBrainz / Cover Art Archive lookup. Off by default so a plain
# `tunex-library` build carries no network dependency (offline-mandatory);
# `tunex-app` opts in and additionally gates every call behind the
# user-facing opt-in setting (default off).
enrichment = ["dep:ureq"]

[lints]
workspace = true
